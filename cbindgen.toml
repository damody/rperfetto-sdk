language = "C"
include_guard = "RPERFETTO_SDK_H_"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs (scripts/gen_header.sh). Do not edit. */"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
header = """
/*
 * rperfetto-sdk C API: Perfetto TrackEvent producer (in-process .pftrace,
 * system traced producer, ATRACE).
 *
 * Link with librperfetto_sdk.a (plus -lpthread -ldl -lm on Linux) or
 * librperfetto_sdk.so.
 */"""

[parse]
parse_deps = false

[defines]
"target_os = linux" = "RPF_LINUX"
"target_os = android" = "RPF_ANDROID"

[export]
include = ["RpfArgType"]
exclude = ["SEQ_INCREMENTAL_STATE_CLEARED","SEQ_NEEDS_INCREMENTAL_STATE","BUILTIN_CLOCK_REALTIME","BUILTIN_CLOCK_MONOTONIC","BUILTIN_CLOCK_BOOTTIME","TYPE_SLICE_BEGIN","TYPE_SLICE_END","TYPE_INSTANT","TYPE_COUNTER","PAGE_HEADER_SIZE","CHUNK_HEADER_SIZE","PACKET_HEADER_SIZE","MAX_PACKETS_PER_CHUNK","FLAG_FIRST_PACKET_CONTINUES_FROM_PREV","FLAG_LAST_PACKET_CONTINUES_ON_NEXT"]

[export.rename]
"Category" = "RpfCategoryOpaque"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"
