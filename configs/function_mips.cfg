# System trace config for per-function MIPS (sql/function_mips.sql).
# The traced app needs no root and no perf permissions: it only emits
# function slices (category "fn") through the system backend. Instructions
# are counted per CPU by traced_perf and attributed to threads via sched.
#
#   adb shell perfetto --txt -c - -o /data/misc/perfetto-traces/fn.pftrace < configs/function_mips.cfg

buffers { size_kb: 131072 fill_policy: DISCARD }

data_sources { config { name: "linux.ftrace" ftrace_config {
  ftrace_events: "sched/sched_switch"
  ftrace_events: "sched/sched_waking"
  ftrace_events: "power/cpu_frequency"
} } }

data_sources { config { name: "linux.process_stats" process_stats_config { scan_all_processes_on_start: true } } }

# Per-CPU instruction / cycle counts, sampled 4000x per second per busy CPU (the cpu-clock timebase does not tick while a CPU idles). PERF_CLOCK_BOOTTIME cannot be used with hardware followers (perf_event_open fails), so the default clock is kept and trace_processor converts it.
data_sources { config { name: "linux.perf" perf_event_config {
  timebase { counter: SW_CPU_CLOCK frequency: 4000 }
  followers { counter: HW_INSTRUCTIONS name: "instructions" }
  followers { counter: HW_CPU_CYCLES name: "cycles" }
} } }

data_sources { config { name: "track_event" track_event_config {
  disabled_categories: "*"
  enabled_categories: "fn"
} } }

duration_ms: 10000
